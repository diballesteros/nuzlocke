<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="google-site-verification" content="XwrRDsMPrckFQLRLr08o1Cr_fFHzsgun82Bq9Fadmek" />
    <meta
      name="description"
      content="The best online app to track and record nuzlocke encounters and pokemon. Including level caps, custom games, all routes, and pokémon up to generation 8."
    />
    <meta property="og:title" content="Nuzlocke Tracker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuzlocke.netlify.app" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:description"
      content="The best online app to track and record nuzlocke encounters and pokemon. Including level caps, custom games, all routes, and pokémon up to generation 8."
    />
    <meta property="og:site_name" content="Nuzlocke Tracker" />
    <meta property="og:image" content="https://nuzlocke.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Nuzlocke Tracker: a Sword and Shield run with its encounters, statuses and badges"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@relatablecoder" />
    <meta name="twitter:creator" content="@relatablecoder" />
    <link rel="canonical" href="https://nuzlocke.netlify.app" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Nuzlocke Tracker - Track pokemon encounters</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nuzlocke Tracker",
        "url": "https://nuzlocke.netlify.app",
        "description": "The best online app to track and record nuzlocke encounters and pokemon. Including level caps, custom games, all routes, and pokémon up to generation 8.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "image": "https://nuzlocke.netlify.app/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <form name="contact" netlify netlify-honeypot="bot-field" aria-hidden="true" hidden>
      <input name="bot-field" />
      <select name="type">
        <option value="bug">Bug</option>
        <option value="suggestion">Suggestion</option>
      </select>
      <select name="device">
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobile</option>
      </select>
      <select name="os">
        <option value="windows">Windows</option>
        <option value="mac">MAC</option>
        <option value="linux">Linux</option>
        <option value="ios">iOS</option>
        <option value="android">Android</option>
        <option value="other">Other</option>
      </select>
      <select name="browser">
        <option value="googlechrome">Google Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="safari">Safari</option>
        <option value="other">Other</option>
      </select>
      <input name="selectedgame" type="text" />
      <textarea name="description"></textarea>
    </form>
  </body>

  <script
    defer
    data-domain="nuzlocke.netlify.app"
    src="https://plausible.io/js/plausible.js"
  ></script>
</html>
