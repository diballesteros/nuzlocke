  - button "sidebar-button": "!"
  - combobox "games": Sword and Shield
  - button "addgame"
  - button "editgame"
  - heading "Nuzlocke Tracker" [level=1]
- main:
  - navigation:
    - link "Tracker":
      - /url: /
    - link "Rules":
      - /url: /rules
    - link "Stats":
      - /url: /stats
    - link "Builder":
      - /url: /builder
    - link "Calculator":
      - /url: /calculator
  - combobox "Ruleset": Nuzlocke
  - button "New ruleset"
  - button "ADD RULE"
  - button "SHARE"
  - list:
    - listitem:
      - paragraph: Any Pokémon that faints is considered dead, and must be released or put in the Pokémon Storage System permanently
      - button "Move rule 1 down"
    - listitem:
      - paragraph: The player may only catch the first wild Pokémon encountered in each area, and none else. If the first wild Pokémon encountered faints or flees, there are no second chances. If the first encounter in the area is a double battle, the player is free to choose which of the two wild Pokémon they would like to catch but may only catch one of them.
      - button "Move rule 2 up"
      - button "Move rule 2 down"
    - listitem:
      - paragraph: The player must nickname all of their Pokémon, for the sake of forming stronger emotional bonds
      - button "Move rule 3 up"
      - button "Move rule 3 down"
    - listitem:
      - paragraph: No items in battle
      - button "Move rule 4 up"
      - button "Edit rule 4"
      - button "Delete rule 4"
- region "Notifications Alt+T"