- banner:
  - button "Menu, new version"
  - combobox "Game": Sword and Shield
  - button "Add game"
  - button "Edit level caps"
  - heading "Nuzlocke Tracker" [level=1]
- main:
  - navigation:
    - link "Tracker":
      - /url: /
    - link "Rules":
      - /url: /rules
    - link "Stats":
      - /url: /stats
