- banner:
  - button "sidebar-button": "!"
  - combobox "games": Sword and Shield
  - button "addgame"
  - heading "Nuzlocke Tracker" [level=1]
- main:
  - navigation:
    - link "Tracker":
      - /url: /
    - link "Rules":
      - /url: /rules
    - link "Stats":
      - /url: /stats
    - link "Builder":
      - /url: /builder
    - link "Calculator":
      - /url: /calculator
  - button "Field" [expanded]
  - group "Field":
    - text: Game type
    - radiogroup "Game type":
      - radio "Singles" [checked]
      - text: Singles
      - radio "Doubles"
      - text: Doubles
    - text: Terrain
    - radiogroup "Terrain":
      - radio "None" [checked]
      - text: None
      - radio "Electric"
      - text: Electric
      - radio "Grassy"
      - text: Grassy
      - radio "Misty"
      - text: Misty
      - radio "Psychic"
      - text: Psychic
    - text: Weather
    - radiogroup "Weather":
      - radio "None" [checked]
      - text: None
      - radio "Sun"
      - text: Sun
      - radio "Rain"
      - text: Rain
      - radio "Sand"
      - text: Sand
      - radio "Hail"
      - text: Hail
      - radio "Harsh Sunshine"
      - text: Harsh Sunshine
      - radio "Heavy Rain"
      - text: Heavy Rain
      - radio "Strong Winds"
      - text: Strong Winds
    - button "Gravity"
  - button "Reset"
  - button "Help"
  - region "Result":
    - status: "/Lvl \\d+ 0 Atk Bulbasaur Pound vs\\. 0 HP \\/ 0 Def Bulbasaur: 6-8 \\(2\\.5 - 3\\.4%\\)/"
    - text: Pokémon 1 → Pokémon 2
    - button "All results"
  - group "Pokémon":
    - button "Pokémon 1" [pressed]
    - button "Pokémon 2"
  - group "Pokémon 1":
    - text: ""
    - button "Bulbasaur, Change Pokémon":
      - img "Bulbasaur"
      - text: ""
    - button "pokemon type":
      - img
      - text: GRASS
    - button "pokemon type":
      - img
      - text: POISON
    - switch "Show my Pokémon" [checked]
    - text: Show my Pokémon
    - button "Help"
    - group "Level":
      - text: ""
      - button "Level down"
      - textbox "Level": /\d+/
      - button "Level up"
    - combobox "Gender": –
    - combobox "Nature"
    - combobox "Ability"
    - combobox "Item"
    - combobox "Status"
    - button "Clear"
    - radiogroup "Pokémon 1 moves":
      - radio "Show the result of Pound" [checked]
      - 'button "Move 1: Pound , NORMAL"'
      - button "Delete Pound"
      - button "Crit, Pound"
      - button "Z, Pound"
      - radio "Show the result of Pound"
      - 'button "Move 2: Pound , NORMAL"'
      - button "Delete Pound"
      - button "Crit, Pound"
      - button "Z, Pound"
      - radio "Show the result of Pound"
      - 'button "Move 3: Pound , NORMAL"'
      - button "Delete Pound"
      - button "Crit, Pound"
      - button "Z, Pound"
      - radio "Show the result of Pound"
      - 'button "Move 4: Pound , NORMAL"'
      - button "Delete Pound"
      - button "Crit, Pound"
      - button "Z, Pound"
    - text: Current HP
    - textbox "Current HP": /\d+/
    - status: /\/ \d+/
    - group:
      - text: /HP IV \d+ · EV 0/
      - status: /\d+/
    - group:
      - text: /Atk IV \d+ · EV 0/
      - status: /\d+/
    - group:
      - text: /Def IV \d+ · EV 0/
      - status: /\d+/
    - group:
      - text: /Sp\. Atk IV \d+ · EV 0/
      - status: /\d+/
    - group:
      - text: /Sp\. Def IV \d+ · EV 0/
      - status: /\d+/
    - group:
      - text: /Speed IV \d+ · EV 0/
      - status: /\d+/
    - button "Dynamax"
    - button "Light Screen"
    - button "Reflect"
    - button "Protect"
    - button "Stealth Rock"
    - button "Leech Seed"
    - button "Tailwind"
    - button "Foresight"
    - button "Friend Guard"
    - button "Helping Hand"
    - button "Cannonade"
    - button "Aurora Veil"
    - button "Battery"
    - button "Steelsurge"
    - button "Vinelash"
    - button "Volcalith"
    - button "Wildfire"
    - button "Switching out"
    - text: Spikes
    - radiogroup "Spikes":
      - radio "0" [checked]
      - text: "0"
      - radio "1"
      - text: "1"
      - radio "2"
      - text: "2"
      - radio "3"
      - text: "3"
- region "Notifications Alt+T"