name: Cypress Tests
on:
  push:
    branches-ignore:
      - 'renovate/**'

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:24.22.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      # report machine parameters
      - run: npx cypress info
      - run: node --version
      - run: node -p 'os.cpus()'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit:cov
      - run: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: dist

      - name: Save unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          if-no-files-found: error
          path: coverage/unit/coverage-final.json

  ui-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:24.22.0
      options: --user 1001
    needs: install
    strategy:
      # when one test fails, DO NOT cancel the other
      # containers, because this will kill Cypress processes
      # leaving Cypress Cloud hanging ...
      # https://github.com/cypress-io/github-action/issues/48
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        group: [main, other]
        # run copies of the current job in parallel
        containers: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - name: Node info
        run: node -v

      - name: 'UI Tests'
        uses: cypress-io/github-action@v6
        with:
          # Instrumented dev server, so each container reports e2e coverage
          start: npm run dev:cov -- --host
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: ${{ matrix.browser }}
          record: true
          parallel: true
          group: 'UI - ${{ matrix.browser }} - ${{ matrix.group }}'
          spec: cypress/e2e/${{ matrix.group }}/*
          config-file: cypress.config.ts
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # Recommended: pass the GitHub token lets this action correctly
          # determine the unique run id necessary to re-run the checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save e2e coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.browser }}-${{ matrix.group }}-${{ matrix.containers }}
          # A container can get no specs from Cypress Cloud's load balancing
          if-no-files-found: ignore
          path: coverage/e2e/raw/out.json

  coverage:
    runs-on: ubuntu-latest
    needs: ui-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge and check thresholds
        run: npm run coverage

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/merged
