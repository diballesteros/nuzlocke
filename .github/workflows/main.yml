name: CI
on:
  push:
    branches-ignore:
      - 'renovate/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit:cov
      - run: npm run build

      - name: Save unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          if-no-files-found: error
          path: coverage/unit/coverage-final.json

  playwright:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      # Keep the tag on the installed @playwright/test version
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Firefox refuses to start when HOME belongs to another user
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Playwright e2e
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3

      - name: Save failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            test-results
            playwright-report

      - name: Save e2e coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pw-${{ matrix.browser }}-${{ matrix.shard }}
          if-no-files-found: ignore
          path: coverage/playwright/raw

  lighthouse:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      # The same Chromium as e2e, so a browser update can't move the scores on its own
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse budget
        run: npm run lighthouse

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .lighthouseci
            verification/artifacts/lighthouse

  coverage:
    runs-on: ubuntu-latest
    needs: [checks, playwright]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so changed lines can be diffed against master
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge and check thresholds
        run: npm run coverage

      - name: Changed-line coverage
        if: github.ref != 'refs/heads/master'
        run: node scripts/diff-coverage.mjs --base origin/master

      - name: Save coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/merged
